<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <header>
        <h1> TRABALHANDO COM INPUTS </h1>
    </header>

    <!-- inputs -->

    <main>
        <h2> Formulário de cadastro </h2>

        <!-- input - colete informações do usuário -->
        <!-- form - englobar os campos do formulário -->
        <!-- action - pra onde vão as informações preenchidas -->
         <!-- method - forma como vão as informações -->
        <form action="" method="">

            <!--  label - texto de apoio para guiar o input -->
            <!-- forma 1 - label sem input -->
            <label for="nomeCompleto"> Nome Completo: </label>
            <!-- text - caracteres em geral -->
             <!-- name - usado para indentificar o input quando enviar os dados -->
              <!-- id - identificação daqueles elementos html -->
            <input type="text" name="nomeCompleto" id="nomeCompleto">  

            <br><br>

            <!-- forma 2 - input dentro do label -->
             <label>
                Senha
                <!-- password - senhas ocultas -->
                <input type="password">
             </label>

        </form>
    </main>

    <footer>
        <p>&copy; OS SÃO MEUS, EU QUE FIZ TUDO </p>
    </footer>
</body>
</html>
