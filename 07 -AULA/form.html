<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=z, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1> TRABALHANDO COM INPUTS </h1>
    </header>

    <!-- inputs -->

    <main>
        <h2> Formulário de Cadastro </h2>

     
        <form action="">

            <!-- fieldset - segmenta visualmente o formulário -->
            <fieldset>

                <!-- legend - titulo do segmento -->
                <legend> Dados Pessoais </legend>

                <!-- Caixinha de nome -->
                <label for="nome"> Nome: </label>
                <input type="text" name="nome" id="nome">
                <!-- Fim cixinha de nome -->
                
                <br><br>
                <!-- Caixinha de data de nacimento -->

                <label for=" Data de Nascimento ">Data de Nascimento</label>
                <!-- date - apenas data -->
                <input type="date" name="Data de Nascimento" id=""><br><br>
                
                <!-- datetime-local - data e hora juntos -->
                <label for=""></label>
                <input type="datatime-local"> 
                <!-- time - apenas hora -->
                <input type="time" id="" name="">

                <!-- Fim Caixinha de data de nacimento -->

                <br><br>

                <!-- Caixinha de números -->
                <label for="filhos"> Quantidade de Filhos </label>
                <input type="number" name="filhos" id="filhos" 
                min="-3" max="301" step="0.7" value="5">

            </fieldset>
            

        </form>
    </main>

    <footer>
        <p>&copy; OS SÃO MEUS, EU QUE FIZ TUDO </p>
    </footer>
</body>
</html>
