<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <h1>Tabelas top's</h1>
    </header>

    <main>
      <h2>JOGADORES</h2>
      <!-- TABLE - CRIAÇÃO DA TABELA -->
      <!-- BORDER - PROPRIEDADES DE BORDA DA TABELA -->
      <table border="5">
        <!-- THEAD - CABEÇALHO DA TABELA -->
        <thead>
          <!-- TR - CRIAÇÃO DE UMA LINHA -->
          <tr>
            <!-- TH - COLUNA DE UM CABEÇALHO -->
            <th>ID</th>
            <th>NOME</th>
            <th>NUMERO</th>
            <th>CLUBE</th>
            <th>PAIS</th>
          </tr>
        </thead>

        <!-- TBODY = CORPO DA TABELA -->
        <tbody>
          <tr>
            <!-- TD - CÉLULA DA LINHA DO CORPO -->
            <td>1</td>
            <td>Shampoo CR7</td>
            <td>7</td>
            <td>R$ 77</td>
            <td>Beleza</td>
          </tr>
          <tr>
            <!-- ATALHO EMMET: tr*2>td*5 
     Cria 2 linhas (tr) com 5 colunas/células (td) dentro de cada uma.
-->
            <td>2</td>
            <td>Monitor Odyssey 27p</td>
            <td>3</td>
            <td>R$ Caro</td>
            <td>Essencial</td>
          </tr>
          <tr>
            <td>3</td>
            <!-- colspan - diz quantas colunas a célula vai ocupar -->
            <td colspan="3">Mucilon 500g</td>
            <!-- rowspan - diz quantas linhas a célula vai ocupar -->
            <td rowspan="2">Filhos</td>
          </tr>
          <tr>
            <td>4</td>
            <td>Lavador Nasal</td>
            <td>1</td>
            <td>R$ 30</td>
          </tr>
        </tbody>

        <tbody>
          <!-- TFOOT - Rodapé da Tabela-->
          <tr>
            <td colspan="10">Tabela feita por: Dougras</td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
